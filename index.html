<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic Tac Toe</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="container">
    <header>
      <h1>Tic Tac Toe</h1>
      <p class="subtitle">Two Player · Local Multiplayer</p>
    </header>

    <div class="scoreboard">
      <div class="score-card player-x">
        <span class="label">Player X</span>
        <span class="score" id="score-x">0</span>
      </div>
      <div class="score-card draw">
        <span class="label">Draws</span>
        <span class="score" id="score-draw">0</span>
      </div>
      <div class="score-card player-o">
        <span class="label">Player O</span>
        <span class="score" id="score-o">0</span>
      </div>
    </div>

    <div class="status" id="status">Player X's turn</div>

    <div class="board" id="board">
      <button class="cell" data-index="0" aria-label="Cell 1"></button>
      <button class="cell" data-index="1" aria-label="Cell 2"></button>
      <button class="cell" data-index="2" aria-label="Cell 3"></button>
      <button class="cell" data-index="3" aria-label="Cell 4"></button>
      <button class="cell" data-index="4" aria-label="Cell 5"></button>
      <button class="cell" data-index="5" aria-label="Cell 6"></button>
      <button class="cell" data-index="6" aria-label="Cell 7"></button>
      <button class="cell" data-index="7" aria-label="Cell 8"></button>
      <button class="cell" data-index="8" aria-label="Cell 9"></button>
    </div>

    <div class="controls">
      <button class="btn btn-primary" id="reset-btn">New Game</button>
      <button class="btn btn-secondary" id="reset-scores-btn">Reset Scores</button>
    </div>

    <footer>
      <p>Built with HTML · CSS · JavaScript</p>
    </footer>
  </div>

  <div class="modal hidden" id="modal">
    <div class="modal-content">
      <div class="modal-icon" id="modal-icon">🎉</div>
      <h2 id="modal-title">Winner!</h2>
      <p id="modal-message">Player X wins</p>
      <button class="btn btn-primary" id="modal-close">Play Again</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
