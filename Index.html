'''<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 Tic Tac Toe - Ultimate Edition</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Fredoka+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Style.css">
</head>
<body>
    <!-- Animated Background -->
    <div class="bg-animation">
        <div class="circle circle-1"></div>
        <div class="circle circle-2"></div>
        <div class="circle circle-3"></div>
        <div class="circle circle-4"></div>
    </div>

    <!-- Main Container -->
    <div class="container">
        <header class="header">
            <h1 class="title">
                <span class="title-icon">🎮</span>
                Tic Tac Toe
            </h1>
            <p class="subtitle">Ultimate Edition</p>
        </header>

        <!-- Score Board -->
        <div class="score-board">
            <div class="score-card player-x">
                <div class="score-icon">✕</div>
                <div class="score-info">
                    <span class="player-name">Player X</span>
                    <span class="score-value" id="score-x">0</span>
                </div>
            </div>
            <div class="score-card draw">
                <div class="score-icon">🤝</div>
                <div class="score-info">
                    <span class="player-name">Draws</span>
                    <span class="score-value" id="score-draw">0</span>
                </div>
            </div>
            <div class="score-card player-o">
                <div class="score-icon">◯</div>
                <div class="score-info">
                    <span class="player-name">Player O</span>
                    <span class="score-value" id="score-o">0</span>
                </div>
            </div>
        </div>

        <!-- Status Display -->
        <div class="status-container">
            <div id="status" class="status">
                <span class="status-icon">🎯</span>
                <span class="status-text">Player X's Turn</span>
            </div>
            <div id="winning-line" class="winning-line hidden"></div>
        </div>

        <!-- Game Board -->
        <div class="board-wrapper">
            <div id="board" class="board">
                <div class="cell" data-index="0" tabindex="0" role="button" aria-label="Cell 0">
                    <div class="cell-content"></div>
                </div>
                <div class="cell" data-index="1" tabindex="0" role="button" aria-label="Cell 1">
                    <div class="cell-content"></div>
                </div>
                <div class="cell" data-index="2" tabindex="0" role="button" aria-label="Cell 2">
                    <div class="cell-content"></div>
                </div>
                <div class="cell" data-index="3" tabindex="0" role="button" aria-label="Cell 3">
                    <div class="cell-content"></div>
                </div>
                <div class="cell" data-index="4" tabindex="0" role="button" aria-label="Cell 4">
                    <div class="cell-content"></div>
                </div>
                <div class="cell" data-index="5" tabindex="0" role="button" aria-label="Cell 5">
                    <div class="cell-content"></div>
                </div>
                <div class="cell" data-index="6" tabindex="0" role="button" aria-label="Cell 6">
                    <div class="cell-content"></div>
                </div>
                <div class="cell" data-index="7" tabindex="0" role="button" aria-label="Cell 7">
                    <div class="cell-content"></div>
                </div>
                <div class="cell" data-index="8" tabindex="0" role="button" aria-label="Cell 8">
                    <div class="cell-content"></div>
                </div>
            </div>
            
            <!-- Floating particles container -->
            <div id="particles" class="particles"></div>
        </div>

        <!-- Controls -->
        <div class="controls">
            <button id="reset-btn" class="btn btn-reset">
                <span class="btn-icon">🔄</span>
                <span class="btn-text">New Game</span>
            </button>
            <button id="reset-score-btn" class="btn btn-reset-score">
                <span class="btn-icon">🗑️</span>
                <span class="btn-text">Reset Score</span>
            </button>
        </div>
    </div>

    <!-- Victory Modal -->
    <div id="victory-modal" class="victory-modal hidden">
        <div class="modal-content">
            <div class="modal-icon" id="modal-icon">🎉</div>
            <h2 id="modal-title">Player X Wins!</h2>
            <p class="modal-subtitle">Amazing game!</p>
            <button id="play-again-btn" class="btn btn-primary">
                <span class="btn-icon">▶️</span>
                Play Again
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>''',
